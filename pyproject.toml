[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prs-assurance"
dynamic = ["version"]
description = "Project Reliability & Assurance core for AgentOS"
requires-python = ">=3.11"

[tool.setuptools.dynamic]
version = {attr = "prs.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
