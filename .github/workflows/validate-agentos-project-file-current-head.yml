name: Validate AgentOS project-file current head

on:
  workflow_dispatch:
  pull_request:

# Exact-head PR #123 assurance fixture; comment-only synchronize marker for CI admission verification.
jobs:
  challenge-current-project-file:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PRS probes
        uses: actions/checkout@v4

      - name: Check out exact AgentOS PR 123 head
        uses: actions/checkout@v4
        with:
          repository: darrinbaldwindev/AgentOS
          ref: b993632ef44d26c91cab08190968205a6316106d
          path: validation-target/AgentOS
          persist-credentials: false

      - name: Verify exact AgentOS identity
        shell: bash
        run: |
          actual="$(git -C validation-target/AgentOS rev-parse HEAD)"
          test "$actual" = "b993632ef44d26c91cab08190968205a6316106d"

      - name: Challenge project-file mutation semantics
        run: node scripts/challenge-agentos-project-file.mjs validation-target/AgentOS b993632ef44d26c91cab08190968205a6316106d

      - name: Challenge project-file boundaries
        run: node scripts/challenge-agentos-project-file-boundaries.mjs validation-target/AgentOS b993632ef44d26c91cab08190968205a6316106d

      - name: Challenge project-file recovery state
        run: node scripts/challenge-agentos-project-file-recovery-state.mjs validation-target/AgentOS b993632ef44d26c91cab08190968205a6316106d

      - name: Challenge recovery governance
        run: node scripts/challenge-agentos-recovery-governance.mjs validation-target/AgentOS b993632ef44d26c91cab08190968205a6316106d

      - name: Challenge commit ownership through publish and receipt
        run: node scripts/challenge-agentos-project-file-commit-ownership.mjs validation-target/AgentOS b993632ef44d26c91cab08190968205a6316106d

      - name: Record bounded evidence
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p validation-evidence
          cat > validation-evidence/current-project-file.json <<'JSON'
          {
            "schema": "prs.agentos-project-file-current-head.v1",
            "agentos_target": "b993632ef44d26c91cab08190968205a6316106d",
            "pr": 123,
            "owner_windows_laptop_exercised": false,
            "local_wake_execution_enabled": false,
            "production_repository_mutated": false,
            "assurance_scope": [
              "project-file-mutation",
              "approved-root-boundaries",
              "recovery-state",
              "recovery-governance",
              "continuous-lock-ownership-through-publish-and-receipt"
            ],
            "note": "Exact-head adversarial assurance only against AgentOS PR #123. A reproduced negative case is evidence of a defect, not a CI failure. This does not establish full continuous SG-08 closure, owner-laptop acceptance, scheduler/local-wake execution, production readiness, or overall AgentOS GREEN."
          }
          JSON

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prs-agentos-project-file-current-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-evidence/current-project-file.json
          if-no-files-found: error
