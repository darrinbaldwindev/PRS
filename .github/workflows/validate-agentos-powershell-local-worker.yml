name: Validate AgentOS PowerShell local worker seam

on:
  pull_request:
  workflow_dispatch:

jobs:
  assure-local-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PRS probe source
        uses: actions/checkout@v4
      - name: Check out exact AgentOS target
        uses: actions/checkout@v4
        with:
          repository: darrinbaldwindev/AgentOS
          ref: a045ed668a07afd68eb165649377991b6f30851c
          path: validation-target/AgentOS
          persist-credentials: false
      - name: Run immutable PowerShell local worker seam probe
        run: node scripts/challenge-agentos-powershell-local-worker.mjs validation-target/AgentOS a045ed668a07afd68eb165649377991b6f30851c
      - name: Record bounded assurance target
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          cat > validation-evidence/powershell-local-worker.json <<EOF
          {
            "schema": "prs.agentos-powershell-local-worker-workflow.v1",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "prs_commit_sha": "${GITHUB_SHA}",
            "agentos_target": "a045ed668a07afd68eb165649377991b6f30851c",
            "powershell_process_execution_exercised": false,
            "local_wake_execution_exercised": false,
            "scheduler_execution_exercised": false,
            "owner_windows_laptop_exercised": false,
            "assurance_certified": false,
            "production_promotion_allowed": false,
            "recorded_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload bounded assurance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prs-powershell-local-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-evidence/powershell-local-worker.json
          if-no-files-found: error
