name: Validate AgentOS PowerShell capability receipt composition

on:
  pull_request:
  workflow_dispatch:

jobs:
  assure-capability-receipt-composition:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PRS probe source
        uses: actions/checkout@v4
      - name: Check out exact AgentOS target
        uses: actions/checkout@v4
        with:
          repository: darrinbaldwindev/AgentOS
          ref: fc6c4d943c85bc4dcdbed91d4357753236bbda71
          path: validation-target/AgentOS
          persist-credentials: false
      - name: Run immutable capability receipt probe
        run: node scripts/challenge-agentos-powershell-capability-receipt-composition.mjs validation-target/AgentOS fc6c4d943c85bc4dcdbed91d4357753236bbda71
      - name: Record bounded assurance target
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          cat > validation-evidence/powershell-capability-receipt-composition.json <<EOF
          {
            "schema": "prs.agentos-powershell-capability-receipt-composition-workflow.v1",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "prs_commit_sha": "${GITHUB_SHA}",
            "agentos_target": "fc6c4d943c85bc4dcdbed91d4357753236bbda71",
            "powershell_process_execution_exercised": false,
            "local_wake_execution_exercised": false,
            "scheduler_execution_exercised": false,
            "owner_windows_laptop_exercised": false,
            "risk_gate_assured": false,
            "assurance_certified": false,
            "production_promotion_allowed": false,
            "recorded_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload bounded assurance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prs-powershell-capability-receipt-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-evidence/powershell-capability-receipt-composition.json
          if-no-files-found: error
