name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate required foundation files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/PROJECT.md
          test -s docs/OVERSEER.md
          test -s docs/PRODUCT_POSITION.md
          test -s docs/AGENTOS_INTEGRATION.md
          test -s docs/ROADMAP.md
          test -s docs/ASSURANCE_CONTRACT_V0.1.md
          test -s schemas/assurance-result-v0.1.json
          test -s .github/workflows/validate.yml
      - name: Run evaluator tests
        run: python -m pytest -q
      - name: Check out exact AgentOS host-status target
        uses: actions/checkout@v4
        with:
          repository: darrinbaldwindev/AgentOS
          ref: d91abaecf602d7ef223c4888f10fa9361677302e
          path: validation-target/AgentOS
          persist-credentials: false
      - name: Run immutable AgentOS host-status adversarial probe
        run: node scripts/challenge-agentos-host-status.mjs validation-target/AgentOS d91abaecf602d7ef223c4888f10fa9361677302e
      - name: Check out exact AgentOS Level-2 target
        uses: actions/checkout@v4
        with:
          repository: darrinbaldwindev/AgentOS
          ref: fddca3363925b9acb5ecb05552ae5d82ce7fed32
          path: validation-target/AgentOS-level2
          persist-credentials: false
      - name: Run immutable AgentOS Level-2 project-file adversarial probe
        run: node scripts/challenge-agentos-project-file.mjs validation-target/AgentOS-level2 fddca3363925b9acb5ecb05552ae5d82ce7fed32
      - name: Run immutable AgentOS project-file boundary probe
        run: node scripts/challenge-agentos-project-file-boundaries.mjs validation-target/AgentOS-level2 fddca3363925b9acb5ecb05552ae5d82ce7fed32
      - name: Run immutable AgentOS recovery-governance probe
        run: node scripts/challenge-agentos-recovery-governance.mjs validation-target/AgentOS-level2 fddca3363925b9acb5ecb05552ae5d82ce7fed32
      - name: Run immutable AgentOS recovery-state adversarial probe
        run: node scripts/challenge-agentos-project-file-recovery-state.mjs validation-target/AgentOS-level2 fddca3363925b9acb5ecb05552ae5d82ce7fed32
      - name: Run immutable AgentOS PowerShell adversarial probe
        run: node scripts/challenge-agentos-powershell.mjs validation-target/AgentOS-level2 fddca3363925b9acb5ecb05552ae5d82ce7fed32
      - name: Check out exact GemVerse Level-2 fixture target
        uses: actions/checkout@v4
        with:
          repository: darrinbaldwindev/GemVerse
          ref: b50973474fad510c650507cc978ba2466c09f0a6
          path: validation-target/GemVerse
          persist-credentials: false
      - name: Run AgentOS against exact GemVerse Level-2 fixture
        run: node scripts/challenge-agentos-gemverse-level2-fixture.mjs validation-target/AgentOS-level2 fddca3363925b9acb5ecb05552ae5d82ce7fed32 validation-target/GemVerse b50973474fad510c650507cc978ba2466c09f0a6
      - name: Write validation evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          cat > validation-evidence/github-actions-validation.json <<EOF
          {
            "schema": "prs.github-actions-validation.v1",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit_sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "event": "${GITHUB_EVENT_NAME}",
            "runner": "${RUNNER_OS}",
            "agentos_host_status_target": "d91abaecf602d7ef223c4888f10fa9361677302e",
            "agentos_level2_target": "fddca3363925b9acb5ecb05552ae5d82ce7fed32",
            "gemverse_level2_fixture_target": "b50973474fad510c650507cc978ba2466c09f0a6",
            "level2_probes": ["project-file", "project-file-boundaries", "recovery-governance", "project-file-recovery-state", "powershell", "gemverse-level2-fixture"],
            "recorded_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "note": "Workflow execution evidence only; GemVerse is an ephemeral checkout. This does not constitute physical Windows acceptance, scheduler/local-wake pickup, production readiness, or overall AgentOS GREEN."
          }
          EOF
      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prs-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-evidence/github-actions-validation.json
          if-no-files-found: error
