name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate required foundation files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/PROJECT.md
          test -s docs/OVERSEER.md
          test -s docs/PRODUCT_POSITION.md
          test -s docs/AGENTOS_INTEGRATION.md
          test -s docs/ROADMAP.md
          test -s docs/ASSURANCE_CONTRACT_V0.1.md
          test -s schemas/assurance-result-v0.1.json
          test -s .github/workflows/validate.yml
      - name: Run evaluator tests
        run: python -m pytest -q
