name: Validate AgentOS remote authority admission

on:
  workflow_dispatch:
  pull_request:

jobs:
  challenge-remote-authority-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PRS probes
        uses: actions/checkout@v4

      - name: Check out exact AgentOS PR 104 head
        uses: actions/checkout@v4
        with:
          repository: darrinbaldwindev/AgentOS
          ref: 607f2683b7d3b234fc6ffa70e2a7d42e31499c3a
          path: validation-target/AgentOS
          persist-credentials: false

      - name: Verify exact AgentOS identity
        shell: bash
        run: |
          actual="$(git -C validation-target/AgentOS rev-parse HEAD)"
          test "$actual" = "607f2683b7d3b234fc6ffa70e2a7d42e31499c3a"

      - name: Challenge remote authority admission compatibility and provenance seams
        shell: bash
        run: |
          mkdir -p validation-evidence
          node scripts/challenge-agentos-remote-authority-admission.mjs validation-target/AgentOS 607f2683b7d3b234fc6ffa70e2a7d42e31499c3a \
            | tee validation-evidence/remote-authority-admission.json

      - name: Record bounded scope
        if: ${{ always() }}
        shell: bash
        run: |
          cat > validation-evidence/remote-authority-admission-scope.json <<'JSON'
          {
            "schema": "prs.agentos-remote-authority-admission-scope.v1",
            "agentos_target": "607f2683b7d3b234fc6ffa70e2a7d42e31499c3a",
            "pr": 104,
            "authenticated_transport_exercised": false,
            "canonical_grant_source_exercised": false,
            "owner_windows_laptop_exercised": false,
            "production_remote_execution_enabled": false,
            "note": "Exact-head offline admission compatibility/provenance challenge only. Caller-injected actor/grant inputs are not proof of authenticated transport or canonical grant lookup."
          }
          JSON

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prs-agentos-remote-authority-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-evidence/
          if-no-files-found: error
