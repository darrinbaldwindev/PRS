name: Validate AgentOS PowerShell physical acceptance boundary

on:
  pull_request:
  workflow_dispatch:

jobs:
  assure-physical-acceptance-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PRS probe source
        uses: actions/checkout@v4
      - name: Check out exact AgentOS target
        uses: actions/checkout@v4
        with:
          repository: darrinbaldwindev/AgentOS
          ref: b4a3775432d5358cae332c70bacd1282ac1c7f3d
          path: validation-target/AgentOS
          persist-credentials: false
      - name: Run immutable physical-acceptance boundary probe
        run: node scripts/challenge-agentos-powershell-physical-acceptance-boundary.mjs validation-target/AgentOS b4a3775432d5358cae332c70bacd1282ac1c7f3d
      - name: Record bounded assurance target
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          cat > validation-evidence/powershell-physical-acceptance-boundary.json <<EOF
          {
            "schema": "prs.agentos-powershell-physical-acceptance-boundary-workflow.v1",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "prs_commit_sha": "${GITHUB_SHA}",
            "agentos_target": "b4a3775432d5358cae332c70bacd1282ac1c7f3d",
            "real_powershell_process_exercised": false,
            "owner_windows_laptop_exercised": false,
            "local_wake_execution_exercised": false,
            "scheduler_execution_exercised": false,
            "assurance_certified": false,
            "production_promotion_allowed": false,
            "recorded_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload bounded assurance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prs-powershell-physical-acceptance-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-evidence/powershell-physical-acceptance-boundary.json
          if-no-files-found: error
